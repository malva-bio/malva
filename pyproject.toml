[build-system]
requires = ["poetry", "Cython>=0.29.21", "setuptools", "wheel", "numpy>=1.17.0", "pkgconfig"]
build-backend = "poetry.masonry.api"

[tool.poetry]
name = "malva"
version = "1.0.0"
description = "malva: fast indexing and querying of genomic sequences from single-cell omics data"
license = "LicenseRef-Malva-Academic-NonCommercial"
authors = [
    "Daniel León-Periñán <daniel.leonperinan@mdc-berlin.de>",
    "Nikolaos Karaiskos <nikolaos.karaiskos@mdc-berlin.de>",
]
maintainers = [
    "Daniel León-Periñán <daniel.leonperinan@mdc-berlin.de>",
    "Nikolaos Karaiskos <nikolaos.karaiskos@mdc-berlin.de>",
]
readme = "README.md"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: Other/Proprietary License",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "Topic :: Scientific/Engineering :: Visualization",
]
include = ["malva/data/*.yaml", "malva/serve/static/index.html"]

[tool.poetry.build]
script = "build.py"
generate-setup-file = true

[tool.poetry.dependencies]
python = ">=3.9,<3.13"
numpy = ">=1.17.0"
pandas = ">=1.0"
dnaio = ">1.0.0"
xopen = ">=1.7.0"
h5py = ">=3"
rich = ">13.0"
setproctitle = ">1.0"
tifffile = ">2022.4.8"
pyyaml = ">5.4"
datashader = ">0.15.0"
flask = ">2.3.0"
flask_session = ">=0.8.0"
flask_cors = ">=6.0.2"
biopython = ">=1.83"
scikit-image = ">=0.24.0"
ollama = ">=0.3.1"
tqdm = ">=4.66.6"

[tool.poetry.extras]
# pip install 'malva[sra]'   — adds SRA archive support (requires sra-tools on PATH)
sra = ["sra-reader"]
# pip install 'malva[bam]'   — adds BAM file support
bam = ["pysam"]
# pip install 'malva[all]'   — all optional input formats
all = ["sra-reader", "pysam"]

[tool.poetry.dependencies.sra-reader]
version = ">=0.1.0"
optional = true

[tool.poetry.dependencies.pysam]
version = ">=0.22.0"
optional = true

[tool.poetry.group.dev.dependencies]
Cython = "^0.29.21,<3.0.11"
pytest = ">=7.0.0"
pytest-cov = ">=4.0.0"
coverage = ">=7.0.0"
pkgconfig = "*"

[tool.poetry.urls]
"Documentation" = "https://rajewsky-lab.github.io/malva"
"Source" = "https://github.com/rajewsky-lab/malva"
"Home-page" = "https://rajewsky-lab.github.io/malva"

[tool.poetry.scripts]
malva = 'malva.__main__:run_malva'

[tool.coverage.run]
plugins = ["Cython.Coverage"]
source = ["malva"]
parallel = true
branch = true
relative_files = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "pass",
    "raise Import.*"
]

[tool.coverage.html]
directory = "htmlcov"

# wheel building (cibuildwheel)
[tool.cibuildwheel]
# Build for CPython 3.9-3.12; skip 32-bit and musl targets
build = "cp39-* cp310-* cp311-* cp312-*"
skip = "*-win32 *-manylinux_i686 *-musllinux*"
# Install Cython and numpy before building the extensions
before-build = "pip install 'cython>=3.0' 'numpy>=1.21'"
# Always build production wheels (no tracing hooks)
environment = {MALVA_DEBUG_BUILD = "0"}

[tool.cibuildwheel.linux]
# liburing is required on Linux for io_uring support in indexes.pyx
before-all = "yum install -y liburing-devel 2>/dev/null || apt-get install -y liburing-dev 2>/dev/null || true"
manylinux-x86_64-image = "manylinux_2_28"
archs = ["x86_64"]

[tool.cibuildwheel.macos]
archs = ["x86_64", "arm64"]