<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Viewer</title>
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
</head>
<body>
    <div class="container">
        <div id="image-container" class="rounded">
            <img src="{{ image_path }}" alt="Generated Image">
        </div>
        <div id="sequence-panel" class="card rounded">
            <div id="toggle-button">&#9660;</div>
            <div id="sequence-panel-content">
                <form action="/" method="post">
                    <div class="form-group">
                        <label for="sequence">Enter Sequence:</label>
                        <input type="text" class="form-control" id="sequence" name="sequence" placeholder="Sequence...">
                    </div>
                    <div class="form-group">
                        <label for="color-scale">Color Scale:</label>
                        <select class="form-control" id="color-scale">
                            <option value="viridis">Viridis</option>
                            <option value="inferno">Inferno</option>
                            <option value="grays">Grays</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-primary">Find</button>
                    <a href="/download" class="btn btn-secondary">Download Image and Sequence</a>
                </form>
            </div>
        </div>
        <div id="plot"></div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
